spring.application.name=jobfinder
# Secrets live in .env (git-ignored), e.g. GOOGLE_API_KEY=... Real environment variables also work.
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8080}

# Gemini model used by all agents. The API key comes from the GOOGLE_API_KEY environment variable.
# Flash-Lite has a much bigger free daily quota than Flash (gemini-3.8-flash allows only 20 requests/day free).
jobfinder.model=${JOBFINDER_MODEL:gemini-3.5-flash-lite}
jobfinder.follow-up-days=5

# Local file database in ./data (kept between restarts). Set DATABASE_URL etc. for PostgreSQL when deploying.
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/jobfinder;AUTO_SERVER=TRUE}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
