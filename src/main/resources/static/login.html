<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Job Finder</title>
<link rel="stylesheet" href="/app.css">
<style>
  body { min-height: 100vh; display: flex; flex-direction: column; }
  header { padding: 20px 24px; }
  main { flex: 1; display: flex; align-items: flex-start; justify-content: center; padding: 6vh 16px 40px; }
  .panel { width: 100%; max-width: 400px; }
  h1 { font-size: 28px; letter-spacing: -0.02em; margin: 0 0 6px; }
  .sub { margin: 0 0 28px; }
  .social { display: flex; flex-direction: column; gap: 10px; }
  .social .btn { width: 100%; padding: 12px 16px; font-size: 15px; }
  .social svg { width: 18px; height: 18px; flex: none; }
  .divider { display: flex; align-items: center; gap: 12px; margin: 22px 0; color: var(--muted); font-size: 13px; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .field { margin-bottom: 14px; }
  form .btn.primary { width: 100%; padding: 12px 16px; font-size: 15px; margin-top: 4px; }
  .notice { padding: 10px 12px; border-radius: 8px; font-size: 14px; margin-bottom: 18px; border: 1px solid var(--line); background: var(--subtle); }
  .notice.error { border-color: var(--s-rejected); color: var(--s-rejected); }
  [hidden] { display: none !important; }
  footer { text-align: center; font-size: 13px; padding: 20px; }
</style>
</head>
<body>
<header><a class="logo" href="/">jobfinder<span class="dot">.</span></a></header>
<main>
  <div class="panel">
    <h1>Welcome back</h1>
    <p class="sub muted">Sign in to your job-hunt workspace.</p>

    <div id="notice" class="notice" hidden></div>

    <div class="social" id="social" hidden>
      <a class="btn" id="google" href="/oauth2/authorization/google" hidden>
        <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
        Continue with Google
      </a>
      <a class="btn" id="github" href="/oauth2/authorization/github" hidden>
        <svg viewBox="0 0 16 16" aria-hidden="true" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
        Continue with GitHub
      </a>
      <div class="divider">or sign in with password</div>
    </div>

    <form method="post" action="/login" id="form">
      <input type="hidden" id="csrf">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn primary" id="submit" disabled>Sign in</button>
    </form>
  </div>
</main>
<footer class="muted">Private workspace · only allowed accounts can sign in</footer>

<script>
  const params = new URLSearchParams(location.search);
  const notice = document.getElementById("notice");
  if (params.has("error")) {
    notice.hidden = false; notice.className = "notice error";
    notice.textContent = "Couldn't sign you in. Check your password, or use an account that's allowed.";
  } else if (params.has("logout")) {
    notice.hidden = false; notice.textContent = "You've been signed out.";
  }
  fetch("/auth/info", { credentials: "same-origin" }).then(r => r.json()).then(info => {
    const csrf = document.getElementById("csrf");
    csrf.name = info.csrfParam; csrf.value = info.csrfToken;
    document.getElementById("submit").disabled = false;
    if (info.providers.length) {
      document.getElementById("social").hidden = false;
      info.providers.forEach(p => document.getElementById(p).hidden = false);
    }
  }).catch(() => {
    notice.hidden = false; notice.className = "notice error";
    notice.textContent = "The server is waking up. Refresh in a few seconds.";
  });
</script>
</body>
</html>
